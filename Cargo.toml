[workspace]
resolver = "2"
members = ["crates/git-core", "crates/log-graph", "crates/tailgit-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
git-core = { path = "crates/git-core" }
log-graph = { path = "crates/log-graph" }
thiserror = "2"
anyhow = "1"
similar = "2"
